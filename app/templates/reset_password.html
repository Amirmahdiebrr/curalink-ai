<!-- app/templates/reset_password.html -->
{% extends "base.html" %}

{% block title %}{{ t('reset_password_title') }} | CuraLink AI{% endblock %}

{% block content %}

<section class="cl-auth-split">

    <div class="cl-auth-brand">
        <div class="cl-auth-brand-inner">
            <img src="/static/images/robot.png" alt="CuraLink AI" class="cl-auth-robot">
            <h2>{{ t('reset_password_heading') }}</h2>
            <p>{{ t('reset_password_desc') }}</p>
        </div>
    </div>

    <div class="cl-auth-form-side">
        <div class="cl-auth-box">

            <img src="/static/images/logo.png" alt="CuraLink AI" class="cl-auth-logo">
            <h1 class="cl-auth-heading">{{ t('reset_password_page_heading') }}</h1>

            {% if error %}
            <div class="cl-auth-alert cl-auth-alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/reset-password" class="cl-auth-fields">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="uid" value="{{ uid }}">
                <input type="hidden" name="token" value="{{ token }}">

                <div class="cl-field">
                    <label for="new_password">{{ t('reset_password_new_label') }}</label>
                    <input type="password" id="new_password" name="new_password" placeholder="{{ t('reset_password_new_placeholder') }}" required>
                </div>

                <div class="cl-field">
                    <label for="new_password_confirm">{{ t('reset_password_confirm_label') }}</label>
                    <input type="password" id="new_password_confirm" name="new_password_confirm" required>
                </div>

                <button type="submit" class="cl-auth-submit">{{ t('reset_password_submit') }}</button>
            </form>

        </div>
    </div>

</section>

{% endblock %}
