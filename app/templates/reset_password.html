{% extends "base.html" %}

{% block title %}تنظیم رمز عبور جدید | CuraLink AI{% endblock %}

{% block content %}

<section class="cl-auth-split">

    <div class="cl-auth-brand">
        <div class="cl-auth-brand-inner">
            <img src="/static/images/robot.png" alt="CuraLink AI" class="cl-auth-robot">
            <h2>تنظیم رمز عبور جدید</h2>
            <p>رمز عبور جدید خود را وارد کنید.</p>
        </div>
    </div>

    <div class="cl-auth-form-side">
        <div class="cl-auth-box">

            <img src="/static/images/logo.png" alt="CuraLink AI" class="cl-auth-logo">
            <h1 class="cl-auth-heading">رمز عبور جدید</h1>

            {% if error %}
            <div class="cl-auth-alert cl-auth-alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/reset-password" class="cl-auth-fields">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="uid" value="{{ uid }}">
                <input type="hidden" name="token" value="{{ token }}">

                <div class="cl-field">
                    <label for="new_password">رمز عبور جدید</label>
                    <input type="password" id="new_password" name="new_password" placeholder="حداقل ۸ کاراکتر، ترکیبی از حروف و عدد" required>
                </div>

                <div class="cl-field">
                    <label for="new_password_confirm">تکرار رمز عبور جدید</label>
                    <input type="password" id="new_password_confirm" name="new_password_confirm" required>
                </div>

                <button type="submit" class="cl-auth-submit">ثبت رمز عبور جدید</button>
            </form>

        </div>
    </div>

</section>

{% endblock %}
