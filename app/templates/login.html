{% extends "base.html" %}

{% block title %}{{ t('login_title') }}{% endblock %}

{% block content %}

<section class="cl-auth-split">

    <div class="cl-auth-brand">
        <div class="cl-auth-brand-inner">
            <img src="/static/images/robot.png" alt="CuraLink AI" class="cl-auth-robot">
            <h2>{{ t('login_brand_heading') }}</h2>
            <p>{{ t('login_brand_desc') }}</p>
        </div>
    </div>

    <div class="cl-auth-form-side">
        <div class="cl-auth-box">

            <img src="/static/images/logo.png" alt="CuraLink AI" class="cl-auth-logo">

            <h1 class="cl-auth-heading">{{ t('login_heading') }}</h1>
            <p class="cl-auth-desc">{{ t('login_desc') }}</p>

            {% if error %}
            <div class="cl-auth-alert cl-auth-alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" class="cl-auth-fields">

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="cl-field">
                    <label for="email">{{ t('field_email') }}</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="cl-field">
                    <label for="password">{{ t('field_password') }}</label>
                    <input type="password" id="password" name="password" placeholder="{{ t('field_password_placeholder') }}" required>
                </div>

                <button type="submit" class="cl-auth-submit">{{ t('login_submit') }}</button>

            </form>

            <p class="cl-auth-footer-link">
    <a href="/forgot-password">{{ t('login_forgot_password') }}</a>
</p>

        </div>
    </div>

</section>

{% endblock %}
