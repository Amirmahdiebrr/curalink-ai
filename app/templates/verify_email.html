<!-- app/templates/verify_email.html -->
{% extends "base.html" %}

{% block title %}{{ t('verify_email_title') }} | CuraLink AI{% endblock %}

{% block content %}

<div class="container py-5 text-center">

    {% if success %}
    <span class="material-symbols-outlined" style="font-size:44px; color:var(--accent-2);">check_circle</span>
    {% else %}
    <span class="error-icon material-symbols-outlined">error</span>
    {% endif %}

    <h2 class="mt-4">{{ message }}</h2>

    <a href="/" class="btn btn-solid">{{ t('verify_email_back_home') }}</a>

</div>

{% endblock %}
